name: interview
description: "A clean-architecture Flutter app built with **GetX** that fetches and displays top headlines from the News API."
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  either_dart: ^1.0.0
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  curl_logger_dio_interceptor: ^1.0.0
  equatable: ^2.0.7
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/raster/
    - assets/vector/
    - .env

  fonts:
    - family: dana_regular
      fonts:
        - asset: assets/fonts/dana_regular.ttf